name: Database Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # 01:00 IST daily = 19:30 UTC previous day
    - cron: "30 19 * * *"

jobs:
  db-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 make

      - name: Rebuild database
        run: make db-rebuild DB_FILE=ci-banking.sqlite

      - name: Verify database
        run: make db-verify DB_FILE=ci-banking.sqlite

      - name: Generate DB report
        run: make db-report DB_FILE=ci-banking.sqlite

      - name: Upload DB report artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-health-report
          path: reports/db-health-report.md
          if-no-files-found: error

      - name: Upload DB snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-banking-sqlite
          path: ci-banking.sqlite
          if-no-files-found: error
