name: Database Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    # 12:00 AM IST daily = 18:30 UTC previous day
    - cron: "30 18 * * *"

concurrency:
  group: db-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_FILE: ci-banking.sqlite
  REPORT_DIR: reports

jobs:
  db-checks:
    name: Rebuild, verify, and publish health report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report workspace
        run: mkdir -p "${{ env.REPORT_DIR }}"

      - name: Set up database tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 make

      - name: Rebuild database from migrations
        id: rebuild
        continue-on-error: true
        run: |
          set -o pipefail
          make db-rebuild DB_FILE="${{ env.DB_FILE }}" 2>&1 | tee "${{ env.REPORT_DIR }}/rebuild.log"

      - name: Verify schema and integrity
        id: verify
        if: always() && steps.rebuild.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          make db-verify DB_FILE="${{ env.DB_FILE }}" 2>&1 | tee "${{ env.REPORT_DIR }}/verify.log"

      - name: Generate health reports
        if: always() && steps.rebuild.outcome == 'success'
        run: make db-report DB_FILE="${{ env.DB_FILE }}"

      - name: Publish HTML report to workflow summary
        if: always() && steps.rebuild.outcome == 'success'
        run: make db-publish-summary

      - name: Prepare email report
        if: always()
        env:
          REBUILD_OUTCOME: ${{ steps.rebuild.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome != '' && steps.verify.outcome || 'skipped' }}
          PIPELINE_NAME: ${{ github.workflow }}
        run: make db-prepare-email DB_FILE="${{ env.DB_FILE }}"

      - name: Check email notification configuration
        id: email_config
        if: always()
        shell: bash
        run: |
          if [[ -n "${{ secrets.SMTP_SERVER }}" && -n "${{ secrets.SMTP_PASSWORD }}" && -n "${{ secrets.SMTP_TO }}" && -n "${{ secrets.SMTP_FROM }}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "Email secrets are not fully configured. Skipping email delivery."
          fi

      - name: Send pipeline report email
        if: always() && steps.email_config.outputs.configured == 'true'
        uses: ./.github/actions/send-db-report-email
        with:
          subject-file: ${{ env.REPORT_DIR }}/pipeline-email-subject.txt
          html-file: ${{ env.REPORT_DIR }}/pipeline-email.html
          plain-file: ${{ env.REPORT_DIR }}/pipeline-email-plain.txt
          smtp-server: ${{ secrets.SMTP_SERVER }}
          smtp-port: ${{ secrets.SMTP_PORT || '587' }}
          smtp-password: ${{ secrets.SMTP_PASSWORD }}
          email-to: ${{ secrets.SMTP_TO }}
          email-from: ${{ secrets.SMTP_FROM }}

      - name: Upload health report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-health-report
          path: |
            ${{ env.REPORT_DIR }}/db-health-report.md
            ${{ env.REPORT_DIR }}/db-health-report.html
            ${{ env.REPORT_DIR }}/db-failure-report.html
            ${{ env.REPORT_DIR }}/pipeline-email.html
            ${{ env.REPORT_DIR }}/db-verification-failures.tsv
            ${{ env.REPORT_DIR }}/rebuild.log
            ${{ env.REPORT_DIR }}/verify.log
          if-no-files-found: warn

      - name: Upload database snapshot
        if: always() && steps.rebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ci-banking-sqlite
          path: ${{ env.DB_FILE }}
          if-no-files-found: warn

      - name: Fail workflow if pipeline checks failed
        if: always() && (steps.rebuild.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: |
          echo "Pipeline failed during rebuild or verification."
          exit 1
