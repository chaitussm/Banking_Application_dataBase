name: Database Weekly Monitor

on:
  workflow_dispatch:
  schedule:
    # Monday 01:00 IST = Sunday 19:30 UTC
    - cron: "30 19 * * 0"

concurrency:
  group: db-weekly-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_FILE: weekly-banking.sqlite
  REPORT_DIR: reports

jobs:
  weekly-db-monitor:
    name: Weekly verification and alerting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare report workspace
        run: mkdir -p "${{ env.REPORT_DIR }}"

      - name: Set up database tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 make

      - name: Rebuild database from migrations
        id: rebuild
        continue-on-error: true
        run: |
          set -o pipefail
          make db-rebuild DB_FILE="${{ env.DB_FILE }}" 2>&1 | tee "${{ env.REPORT_DIR }}/rebuild.log"

      - name: Verify schema and integrity
        id: verify
        if: always() && steps.rebuild.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          make db-verify DB_FILE="${{ env.DB_FILE }}" 2>&1 | tee "${{ env.REPORT_DIR }}/verify.log"

      - name: Generate health reports
        if: always() && steps.rebuild.outcome == 'success'
        run: make db-report DB_FILE="${{ env.DB_FILE }}"

      - name: Publish HTML report to workflow summary
        if: always() && steps.rebuild.outcome == 'success'
        run: make db-publish-summary

      - name: Prepare email report
        if: always()
        env:
          REBUILD_OUTCOME: ${{ steps.rebuild.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome != '' && steps.verify.outcome || 'skipped' }}
          PIPELINE_NAME: ${{ github.workflow }}
        run: make db-prepare-email DB_FILE="${{ env.DB_FILE }}"

      - name: Check email notification configuration
        id: email_config
        if: always()
        shell: bash
        run: |
          if [[ -n "${{ secrets.SMTP_SERVER }}" && -n "${{ secrets.SMTP_PASSWORD }}" && -n "${{ secrets.SMTP_TO }}" && -n "${{ secrets.SMTP_FROM }}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "Email secrets are not fully configured. Skipping email delivery."
          fi

      - name: Send pipeline report email
        if: always() && steps.email_config.outputs.configured == 'true'
        uses: ./.github/actions/send-db-report-email
        with:
          subject-file: ${{ env.REPORT_DIR }}/pipeline-email-subject.txt
          html-file: ${{ env.REPORT_DIR }}/pipeline-email.html
          plain-file: ${{ env.REPORT_DIR }}/pipeline-email-plain.txt
          smtp-server: ${{ secrets.SMTP_SERVER }}
          smtp-port: ${{ secrets.SMTP_PORT || '587' }}
          smtp-password: ${{ secrets.SMTP_PASSWORD }}
          email-to: ${{ secrets.SMTP_TO }}
          email-from: ${{ secrets.SMTP_FROM }}

      - name: Upload health report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-db-health-report
          path: |
            ${{ env.REPORT_DIR }}/db-health-report.md
            ${{ env.REPORT_DIR }}/db-health-report.html
            ${{ env.REPORT_DIR }}/db-failure-report.html
            ${{ env.REPORT_DIR }}/pipeline-email.html
            ${{ env.REPORT_DIR }}/db-verification-failures.tsv
            ${{ env.REPORT_DIR }}/rebuild.log
            ${{ env.REPORT_DIR }}/verify.log
          if-no-files-found: warn

      - name: Check for existing open monitor issue
        if: steps.verify.outcome == 'failure'
        id: existing_issue
        uses: actions/github-script@v7
        with:
          script: |
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "[DB Weekly Monitor] Verification failed"`;
            const result = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 1 });
            const hasOpenIssue = result.data.total_count > 0;

            core.setOutput("has_open_issue", hasOpenIssue ? "true" : "false");
            if (hasOpenIssue) {
              core.setOutput("existing_issue_number", String(result.data.items[0].number));
            }

      - name: Create issue on verification failure
        if: steps.verify.outcome == 'failure' && steps.existing_issue.outputs.has_open_issue != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[DB Weekly Monitor] Verification failed - ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              "Automated weekly database monitor detected a verification failure.",
              "",
              `- Workflow run: ${runUrl}`,
              `- Workflow: ${context.workflow}`,
              `- Commit: ${context.sha}`,
              "",
              "An HTML failure report was emailed when SMTP secrets are configured.",
              "Inspect the workflow summary, report artifacts, and logs before fixing the failing check."
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

      - name: Reuse existing open issue
        if: steps.verify.outcome == 'failure' && steps.existing_issue.outputs.has_open_issue == 'true'
        run: |
          echo "Open issue already exists: #${{ steps.existing_issue.outputs.existing_issue_number }}"

      - name: Fail workflow if pipeline checks failed
        if: always() && (steps.rebuild.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: |
          echo "Database verification failed. Issue created or reused when applicable."
          exit 1
