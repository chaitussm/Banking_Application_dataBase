name: Send database pipeline email report
description: Send rendered HTML and plain-text pipeline report emails

inputs:
  subject-file:
    description: Path to the prepared email subject file
    required: true
  html-file:
    description: Path to the prepared HTML email body
    required: true
  plain-file:
    description: Path to the prepared plain-text email body
    required: false
    default: ""
  smtp-server:
    description: SMTP server hostname
    required: true
  smtp-port:
    description: SMTP server port
    required: false
    default: "587"
  smtp-username:
    description: SMTP username (defaults to sender email when omitted)
    required: false
    default: ""
  smtp-password:
    description: SMTP password
    required: true
  email-to:
    description: Recipient email address
    required: true
  email-from:
    description: Sender email address
    required: true

runs:
  using: composite
  steps:
    - name: Validate email report files
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -f "${{ inputs.subject-file }}" ]]; then
          echo "Email subject file not found: ${{ inputs.subject-file }}" >&2
          exit 1
        fi
        if [[ ! -f "${{ inputs.html-file }}" ]]; then
          echo "Email HTML file not found: ${{ inputs.html-file }}" >&2
          exit 1
        fi

    - name: Send rendered HTML email report
      shell: bash
      env:
        EMAIL_SUBJECT_FILE: ${{ inputs.subject-file }}
        EMAIL_HTML_FILE: ${{ inputs.html-file }}
        EMAIL_PLAIN_FILE: ${{ inputs.plain-file }}
        SMTP_SERVER: ${{ inputs.smtp-server }}
        SMTP_PORT: ${{ inputs.smtp-port }}
        SMTP_USERNAME: ${{ inputs.smtp-username != '' && inputs.smtp-username || inputs.email-from }}
        SMTP_PASSWORD: ${{ inputs.smtp-password }}
        SMTP_FROM: ${{ inputs.email-from }}
        SMTP_TO: ${{ inputs.email-to }}
      run: python3 scripts/send_pipeline_email.py
